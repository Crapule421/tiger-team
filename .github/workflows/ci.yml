name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint and guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural lint
        run: bash tests/lint.sh
      - name: Confidentiality guard tests
        run: bash tests/confidentiality-guard.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PDF kit unit tests
        run: node --test tests/print-kit.test.mjs
